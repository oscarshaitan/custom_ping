name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.35.7", "3.47.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: dart pub publish --dry-run

  android:
    name: Example debug APK (Flutter ${{ matrix.flutter }}, ${{ matrix.agp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: "3.35.7"
            agp: "AGP 8"
          - flutter: "3.47.9"
            agp: "AGP 8"
          - flutter: "3.47.9"
            agp: "AGP 9, built-in Kotlin"
            agp9_built_in_kotlin: "true"
          - flutter: "3.47.9"
            agp: "AGP 9, builtInKotlin=false"
            agp9_built_in_kotlin: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Switch the example to AGP 9
        if: matrix.agp9_built_in_kotlin != ''
        run: .github/scripts/example_use_agp9.sh ${{ matrix.agp9_built_in_kotlin }}
      - name: Build debug APK
        working-directory: custom_ping_example
        shell: bash
        run: |
          flutter pub get
          flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -la build/app/outputs/flutter-apk/app-debug.apk
      - name: Flutter does not report custom_ping as applying the Kotlin Gradle plugin
        shell: bash
        run: |
          if grep -E "plugins that apply Kotlin Gradle Plugin.*custom_ping" "$RUNNER_TEMP/build.log"; then
            echo "::error::Flutter reports custom_ping as a plugin that applies KGP"
            exit 1
          fi

  ios:
    name: Example iOS simulator build (Flutter ${{ matrix.flutter }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.35.7", "3.47.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: xcodebuild -version
      # Flutter 3.47 turns Swift Package Manager on by default; this leg keeps
      # proving the CocoaPods path, so it is switched off explicitly.
      - run: flutter config --no-enable-swift-package-manager
      - name: Build for the iOS simulator (CocoaPods)
        working-directory: custom_ping_example
        run: |
          flutter pub get
          flutter build ios --simulator --debug
          ls -d build/ios/iphonesimulator/Runner.app
      - name: custom_ping was integrated as a CocoaPods pod
        working-directory: custom_ping_example/ios
        run: |
          grep -E "^  - custom_ping " Podfile.lock
          ls -d Pods/Target\ Support\ Files/custom_ping

  ios-swiftpm:
    name: Example iOS simulator build, Swift Package Manager (Flutter ${{ matrix.flutter }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.47.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: xcodebuild -version
      - run: flutter config --enable-swift-package-manager
      - name: Build for the iOS simulator (Swift Package Manager)
        working-directory: custom_ping_example
        shell: bash
        run: |
          flutter pub get
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -d build/ios/iphonesimulator/Runner.app
      - name: custom_ping resolved as a Swift package, not a CocoaPods pod
        working-directory: custom_ping_example/ios
        shell: bash
        run: |
          set -euo pipefail
          generated=Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          cat "$generated"
          grep -E '\.package\(name: "custom_ping", path: ' "$generated"
          grep -F '.product(name: "custom-ping", package: "custom_ping")' "$generated"
          grep -F 'FlutterGeneratedPluginSwiftPackage' Runner.xcodeproj/project.pbxproj
          if grep -E "do not support Swift Package Manager|custom_ping.*CocoaPods" "$RUNNER_TEMP/build.log"; then
            echo "::error::Flutter reports custom_ping as needing CocoaPods"
            exit 1
          fi
          if [ -f Podfile.lock ] && grep -q "custom_ping" Podfile.lock; then
            echo "::error::custom_ping is in Podfile.lock"
            exit 1
          fi
          if [ -d Pods ] && find Pods -maxdepth 2 -name 'custom_ping*' | grep -q .; then
            echo "::error::custom_ping was installed as a pod"
            exit 1
          fi
          echo "custom_ping resolved through Swift Package Manager; no CocoaPods pod for it."
